name: sirena-full

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sirena112}
      POSTGRES_USER: ${POSTGRES_USER:-sirena112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirena112-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  ai:
    image: sirena-112-ai:2026.09.28
    build:
      context: .
      dockerfile: services/ai/Dockerfile.full
    environment:
      AI_PORT: "8090"
      AI_ENGINE: ${AI_ENGINE:-mock}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_STT: ${AI_STT:-vosk}
      AI_STT_MODEL: /models/vosk-model-small-ru-0.22
      AI_TTS: ${AI_TTS:-piper}
      AI_TTS_MODEL: /models/ru_RU-dmitri-medium.onnx
      AI_REQUIRE_REAL_SPEECH: ${AI_REQUIRE_REAL_SPEECH:-true}
    volumes:
      - ${AI_MODELS_DIR:-./models}:/models:ro
    ports:
      - "127.0.0.1:${AI_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *default-logging

  asterisk:
    image: sirena-112-asterisk:2026.09.28
    build:
      context: .
      dockerfile: infra/asterisk/Dockerfile
    environment:
      ARI_USERNAME: ${ASTERISK_ARI_USER:-media}
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-change-me-ari}
      SIP_1001_PASSWORD: ${ASTERISK_SIP_1001_PASSWORD:-change-me-1001}
      SIP_1002_PASSWORD: ${ASTERISK_SIP_1002_PASSWORD:-change-me-1002}
      EXTERNAL_ADDRESS: ${ASTERISK_EXTERNAL_ADDRESS:-127.0.0.1}
    ports:
      - "${SIRENA_BIND_ADDRESS:-127.0.0.1}:${ASTERISK_SIP_PORT:-5060}:5060/udp"
      - "${SIRENA_BIND_ADDRESS:-127.0.0.1}:${ASTERISK_SIP_PORT:-5060}:5060/tcp"
      - "127.0.0.1:${ASTERISK_HTTP_PORT:-8088}:8088/tcp"
      - "${SIRENA_BIND_ADDRESS:-127.0.0.1}:${ASTERISK_RTP_PORT_START:-10000}-${ASTERISK_RTP_PORT_END:-10100}:10000-10100/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u \"$$ARI_USERNAME:$$ARI_PASSWORD\" http://127.0.0.1:8088/ari/asterisk/info >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  media:
    image: sirena-112-media:2026.09.28
    build:
      context: services/media
    environment:
      MEDIA_HTTP_ADDR: ":8091"
      MEDIA_MODE: ${MEDIA_MODE:-ai}
      AI_BASE_URL: ws://ai:8090
      CORE_MEDIA_SERVICE_TOKEN: ${CORE_MEDIA_SERVICE_TOKEN:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      ARI_BASE_URL: http://asterisk:8088/ari
      ARI_USERNAME: ${ASTERISK_ARI_USER:-media}
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-change-me-ari}
      ARI_APP: sirena-media
      RTP_LISTEN_ADDR: "0.0.0.0"
      RTP_PORT: "18000"
      RTP_PORT_END: "18099"
      RTP_PUBLIC_HOST: media
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORE_BASE_URL: http://core:8080
    ports:
      - "127.0.0.1:${MEDIA_PORT:-8091}:8091"
    depends_on:
      ai:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8091/ready"]
      interval: 5s
      timeout: 4s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 25s
    logging: *default-logging

  core:
    image: sirena-112-core:2026.09.28
    build:
      context: .
      dockerfile: services/core/Dockerfile.card
    environment:
      CORE_PORT: "8080"
      CORE_ENVIRONMENT: offline
      CORE_VERSION: "2026.09.28"
      CORE_STORAGE: postgres
      CORE_AUTH_ENABLED: ${CORE_AUTH_ENABLED:-false}
      CORE_BOOTSTRAP_ADMIN_USERNAME: ${CORE_BOOTSTRAP_ADMIN_USERNAME:-}
      CORE_BOOTSTRAP_ADMIN_PASSWORD: ${CORE_BOOTSTRAP_ADMIN_PASSWORD:-}
      CORE_MEDIA_SERVICE_TOKEN: ${CORE_MEDIA_SERVICE_TOKEN:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      CORE_SCENARIO_IMPORT_ENABLED: ${CORE_SCENARIO_IMPORT_ENABLED:-false}
      CORE_FLYWAY_ENABLED: "true"
      CORE_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sirena112}
      CORE_DATABASE_USERNAME: ${POSTGRES_USER:-sirena112}
      CORE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sirena112-local}
      CORE_MEDIA_BASE_URL: http://media:8091
      CORE_MEDIA_MODE: http
      CORE_AI_BASE_URL: http://ai:8090
    ports:
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
      media:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 25s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 25s
    logging: *default-logging

  web:
    image: sirena-112-web:2026.09.28
    build:
      context: .
      dockerfile: apps/web/Dockerfile.full
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-demo}
    ports:
      - "${SIRENA_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 4s
      retries: 20
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped
    logging: *default-logging

  monitor:
    image: sirena-112-monitor:2026.09.28
    build:
      context: .
      dockerfile: infra/monitor/Dockerfile
    environment:
      AI_REQUIRE_REAL_SPEECH: ${AI_REQUIRE_REAL_SPEECH:-true}
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-media}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-change-me-ari}
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8099}:8099"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
      asterisk:
        condition: service_healthy
      media:
        condition: service_healthy
      core:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *default-logging

  card-smoke:
    image: sirena-112-smoke:2026.09.28
    build:
      context: .
      dockerfile: infra/smoke/Dockerfile
    profiles: [smoke]
    command: ["python", "/app/scripts/smoke_card_1050602.py", "--core", "http://core:8080", "--ai", "http://ai:8090", "--expect-ai"]
    depends_on:
      monitor:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  voice-smoke:
    image: sirena-112-smoke:2026.09.28
    build:
      context: .
      dockerfile: infra/smoke/Dockerfile
    profiles: [smoke]
    environment:
      CORE_MEDIA_SERVICE_TOKEN: ${CORE_MEDIA_SERVICE_TOKEN:-}
    command:
      [
        "python",
        "/app/scripts/smoke_voice_stack.py",
        "--core",
        "http://core:8080",
        "--ai",
        "http://ai:8090",
        "--media",
        "http://media:8091",
      ]
    depends_on:
      monitor:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
