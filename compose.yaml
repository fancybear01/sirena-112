name: sirena-112

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sirena112}
      POSTGRES_USER: ${POSTGRES_USER:-sirena112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirena112-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile.card
    environment:
      CORE_PORT: "8080"
      CORE_STORAGE: postgres
      CORE_FLYWAY_ENABLED: "true"
      CORE_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sirena112}
      CORE_DATABASE_USERNAME: ${POSTGRES_USER:-sirena112}
      CORE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sirena112-local}
      CORE_MEDIA_BASE_URL: http://media:8091
      CORE_MEDIA_MODE: ${CORE_MEDIA_MODE:-http}
      CORE_AI_BASE_URL: ${CORE_AI_BASE_URL:-http://host.docker.internal:8090}
    ports:
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  asterisk:
    build:
      context: ./infra/asterisk
    environment:
      ARI_USERNAME: ${ASTERISK_ARI_USER:-media}
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-change-me-ari}
      SIP_1001_PASSWORD: ${ASTERISK_SIP_1001_PASSWORD:-change-me-1001}
      SIP_1002_PASSWORD: ${ASTERISK_SIP_1002_PASSWORD:-change-me-1002}
      EXTERNAL_ADDRESS: ${ASTERISK_EXTERNAL_ADDRESS:-127.0.0.1}
    ports:
      - "${ASTERISK_SIP_PORT:-5060}:5060/udp"
      - "${ASTERISK_SIP_PORT:-5060}:5060/tcp"
      - "127.0.0.1:${ASTERISK_HTTP_PORT:-8088}:8088/tcp"
      - "${ASTERISK_RTP_PORT_START:-10000}-${ASTERISK_RTP_PORT_END:-10100}:10000-10100/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u \"$$ARI_USERNAME:$$ARI_PASSWORD\" http://127.0.0.1:8088/ari/asterisk/info >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  media:
    build:
      context: ./services/media
    environment:
      MEDIA_HTTP_ADDR: ":8091"
      MEDIA_MODE: ${MEDIA_MODE:-echo}
      AI_BASE_URL: ${MEDIA_AI_BASE_URL:-ws://host.docker.internal:8090}
      ARI_BASE_URL: http://asterisk:8088/ari
      ARI_USERNAME: ${ASTERISK_ARI_USER:-media}
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-change-me-ari}
      ARI_APP: sirena-media
      RTP_LISTEN_ADDR: "0.0.0.0"
      RTP_PORT: "18000"
      RTP_PORT_END: "18099"
      RTP_PUBLIC_HOST: media
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORE_BASE_URL: ${MEDIA_CORE_BASE_URL:-}
    ports:
      - "127.0.0.1:${MEDIA_PORT:-8091}:8091"
    depends_on:
      asterisk:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
