# Наложение, включающее TLS для браузерного доступа. Задача #89.
#
# Отдельным файлом, чтобы профиль без TLS остался рабочим: демонстрация и CI
# ходят по HTTP на 5173, а этот файл добавляет 8443 с шифрованием.
#
# Запуск:
#   sh scripts/make_tls_cert.sh
#   docker compose -f compose.yaml -f compose.tls.yaml up -d
#
# Сертификаты монтируются снаружи и в образ не встраиваются.

services:
  web:
    ports:
      - "${SIRENA_BIND_ADDRESS:-127.0.0.1}:${WEB_TLS_PORT:-8443}:8443"
    volumes:
      - ./apps/web/nginx.tls.conf:/etc/nginx/conf.d/tls.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      # Проверяем именно TLS: если сертификат не смонтировался, контейнер
      # обязан считаться нездоровым, а не тихо работать по HTTP.
      test:
        - CMD
        - wget
        - -q
        - --no-check-certificate
        - --spider
        - https://127.0.0.1:8443/health
      interval: 5s
      timeout: 4s
      retries: 20
