name: demo

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  card-compose:
    name: demo / compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate card Compose configuration
        run: docker compose -f compose.card.yaml config --quiet
      - name: Build and start card demo
        run: docker compose -f compose.card.yaml up --build --detach --wait ai core web
      - name: Run two card sessions with AI
        run: docker compose -f compose.card.yaml run --no-deps --rm smoke
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.card.yaml logs --no-color --tail=120 ai core web
      - name: Stop only card demo containers
        if: always()
        run: docker compose -f compose.card.yaml down

  postgres-recovery:
    name: core / postgres-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Речевые модели весят полтораста мегабайт и в репозитории не лежат,
      # поэтому в CI их нет. По умолчанию AI требует настоящую речь и без
      # моделей отдаёт 503 на /ready, из-за чего контейнер становится
      # unhealthy, а Core от него зависит - и шаг падал целиком, хотя
      # проверяется здесь восстановление PostgreSQL, а не голос.
      # Строгую проверку оставляем демо-стенду, где модели есть.
      AI_REQUIRE_REAL_SPEECH: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Core with PostgreSQL
        run: CORE_SCENARIO_IMPORT_ENABLED=true docker compose up --build --detach --wait postgres core
      - name: Run card smoke scenario against PostgreSQL
        # Ожидание изменилось вместе со стеком. Раньше в compose.yaml сервиса
        # AI не было вовсе, Core считал сам, и проверялся именно откат на
        # четыре критерия. После #128 AI в полном стеке есть, значит проверять
        # надо обратное: что Core с ним разговаривает и отчёт полный.
        run: python scripts/smoke_card_1050602.py --core http://127.0.0.1:8080 --expect-ai
      - name: Import a validated scenario through local Core API
        run: python scripts/smoke_import_postgres.py
      - name: Restart Core and check persisted records
        shell: bash
        run: |
          set -euo pipefail
          docker compose restart core
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/ready > /dev/null && break
            sleep 2
          done
          test "$(docker compose exec -T postgres psql -U sirena112 -d sirena112 -tAc 'SELECT count(*) FROM training_sessions')" -ge 2
          test "$(docker compose exec -T postgres psql -U sirena112 -d sirena112 -tAc 'SELECT count(*) FROM session_reports')" -ge 2
          test "$(docker compose exec -T postgres psql -U sirena112 -d sirena112 -tAc 'SELECT count(*) FROM service_assignments')" -gt 0
      - name: Verify imported scenario after Core restart
        run: python scripts/smoke_import_postgres.py --verify-only
      - name: Show Core and PostgreSQL logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150 core postgres
      - name: Stop PostgreSQL Core containers
        if: always()
        run: docker compose down -v

  smoke:
    name: demo / smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            services/core/*.gradle.kts
            services/core/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install AI dependencies
        run: python -m pip install --disable-pip-version-check -e ./services/ai
      - name: Run two complete 1050602 sessions
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --app-dir services/ai --host 127.0.0.1 --port 8090 > "$RUNNER_TEMP/sirena-ai.log" 2>&1 &
          ai_pid=$!
          chmod +x services/core/gradlew
          (cd services/core && CORE_MEDIA_BASE_URL=http://127.0.0.1:18091 ./gradlew bootRun --no-daemon) > "$RUNNER_TEMP/sirena-core.log" 2>&1 &
          core_pid=$!
          trap 'result=$?; kill "$ai_pid" "$core_pid" 2>/dev/null || true; if [ "$result" -ne 0 ]; then tail -100 "$RUNNER_TEMP/sirena-ai.log"; tail -100 "$RUNNER_TEMP/sirena-core.log"; fi' EXIT
          ready=false
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:8090/health > /dev/null 2>&1 && curl -fsS http://127.0.0.1:8080/ready > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          python scripts/smoke_card_1050602.py --expect-ai
          python scripts/smoke_voice_contract.py --core http://127.0.0.1:8080 --ai http://127.0.0.1:8090 --media-port 18091
          kill "$ai_pid"
          wait "$ai_pid" || true
          python scripts/smoke_card_1050602.py --expect-fallback
