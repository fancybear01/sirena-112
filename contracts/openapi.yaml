openapi: 3.1.0
info:
  title: Sirena-112 Core API
  version: 0.4.0
  description: |
    Контракт карточной и голосовой сессии Системы-112. Клиент передаёт только исходные
    сведения оператора; классификацию и маршрутизацию вычисляет Kotlin Core.
    Правила совместимости описаны в contracts/README.md.
servers:
  - url: http://localhost:8080
paths:
  /api/auth/login:
    post:
      summary: Вход пользователя
      responses:
        "200": { description: Пользователь аутентифицирован }
  /api/teacher/scenarios:
    get:
      summary: Список сценариев преподавателя
      responses:
        "200":
          description: Список сценариев
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scenario" }
    post:
      summary: Создать черновик сценария
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Scenario" }
      responses:
        "201":
          description: Сценарий создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scenario" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/teacher/sessions:
    post:
      summary: Создать учебную сессию
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Сессия создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/teacher/sessions/{sessionId}/start:
    post:
      summary: Запустить учебную сессию
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Сессия запущена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/teacher/sessions/{sessionId}/stop:
    post:
      summary: Завершить учебную сессию
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Сессия завершена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/teacher/sessions/{sessionId}/report:
    get:
      summary: Получить отчёт по сессии
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Отчёт сформирован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReport" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/student/assignments:
    get:
      summary: Назначенные задания обучающегося
      responses:
        "200":
          description: Список назначений
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentAssignment" }
  /api/student/sessions/{sessionId}:
    get:
      summary: Получить состояние сессии
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Состояние сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/student/sessions/{sessionId}/card-form:
    get:
      summary: Получить доступные признаки и вопросы карточки
      description: |
        Core возвращает форму для текущего черновика. Клиент не строит правила
        зависимостей и не вычисляет службы самостоятельно.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Доступная форма карточки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardFormDefinition" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/student/sessions/{sessionId}/card:
    patch:
      summary: Сохранить исходные данные карточки и получить пересчитанный результат
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveCardRequest" }
      responses:
        "200":
          description: Карточка сохранена и классификация пересчитана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/student/sessions/{sessionId}/submit:
    post:
      summary: Отправить карточку на оценивание
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitCardRequest" }
      responses:
        "202":
          description: Оценивание завершено или поставлено в очередь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/student/sessions/{sessionId}/service-assignments:
    get:
      summary: Назначения ДДС и полная история статусов
      description: До успешной отправки карточки возвращается пустой массив. Статусы независимы от состояния сессии.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Назначения в порядке создания
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceAssignment" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/teacher/sessions/{sessionId}:
    get:
      summary: Состояние учебной сессии для преподавателя
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Сессия найдена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/teacher/sessions/{sessionId}/call/start:
    post:
      summary: Начать голосовой звонок через AI и Media Gateway
      description: Доступно только для VOICE-сессии. Создаёт AI-сессию до вызова Media; состояние учебной сессии меняется по входящим Media-событиям.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartVoiceCallRequest" }
      responses:
        "202":
          description: Media принял звонок
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceCall" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/teacher/sessions/{sessionId}/call/hangup:
    post:
      summary: Завершить голосовой звонок в Media Gateway
      description: Повторный запрос после завершения идемпотентен. Итоговое состояние учебной сессии фиксирует call.ended, не ответ на команду.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Команда завершения принята
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceCall" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/teacher/sessions/{sessionId}/call:
    get:
      summary: Техническое состояние звонка
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Звонок найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceCall" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/teacher/sessions/{sessionId}/events:
    get:
      summary: Сохранённые события сессии в порядке получения
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: История событий
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionEvent" }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/v1/media/events:
    post:
      summary: Приём события от Media Gateway
      description: Принимает только source=media и события голосовой сессии. Повтор eventId с тем же конвертом возвращает accepted=false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionEvent" }
      responses:
        "200":
          description: Событие обработано или уже принято ранее
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaEventReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/teacher/sessions/{sessionId}/service-assignments:
    get:
      summary: Назначения ДДС для преподавателя
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Назначения в порядке создания
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceAssignment" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/mock/sessions/{sessionId}/service-assignments/{assignmentId}/status:
    post:
      summary: Учебное изменение статуса одной службы
      description: |
        Доступно только при CORE_SERVICE_ASSIGNMENT_MOCK_UPDATES_ENABLED=true.
        Источник изменения MOCK; реального оповещения нет. Повтор eventId возвращает 409
        без изменения истории. Время назначает Core; клиент не может его подменить.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeServiceStatusRequest" }
            examples:
              received:
                value: { eventId: "eaa138be-2d41-42d3-80d0-f7c4df6a0ba2", status: RECEIVED, comment: "Получено диспетчером" }
              refused:
                value: { eventId: "fba138be-2d41-42d3-80d0-f7c4df6a0ba3", status: REFUSED, refusalReason: "Не наша территория" }
      responses:
        "200":
          description: Обновлённое назначение с полной историей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Некорректные или неполные данные
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Недопустимое состояние или устаревшая ревизия карточки
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadGateway:
      description: Внешний сервис нарушил контракт
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unavailable:
      description: AI или Media Gateway недоступен
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    StartVoiceCallRequest:
      type: object
      additionalProperties: false
      required: [sipAddress]
      properties:
        sipAddress:
          type: string
          pattern: '^(PJSIP/)?[A-Za-z0-9_.-]{1,64}$'
          example: PJSIP/1001
    VoiceCall:
      type: object
      additionalProperties: false
      required: [callId, sessionId, aiSessionId, sipAddress, state]
      properties:
        callId: { type: string }
        sessionId: { type: string, format: uuid }
        aiSessionId: { type: string }
        sipAddress: { type: string }
        state: { type: string, enum: [STARTING, RINGING, ACTIVE, ENDED, FAILED] }
    SessionEvent:
      type: object
      additionalProperties: false
      required: [eventId, sessionId, type, timestamp, source, payload]
      properties:
        eventId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        type: { type: string }
        timestamp: { type: string, format: date-time }
        source: { type: string, enum: [core, media, ai, any] }
        payload: { type: object, additionalProperties: true }
    MediaEventReceipt:
      type: object
      additionalProperties: false
      required: [eventId, accepted, sessionState]
      properties:
        eventId: { type: string, format: uuid }
        accepted: { type: boolean }
        sessionState: { type: string, enum: [CREATED, READY, RINGING, ACTIVE, COMPLETED, SCORING, SCORED, FAILED] }
    ServiceStatus:
      type: string
      enum: [ADDED, RECEIVED, ACCEPTED, RESPONDING, ARRIVED, COMPLETED, REFUSED, FAILED]
    ChangeServiceStatusRequest:
      type: object
      additionalProperties: false
      required: [eventId, status]
      properties:
        eventId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        comment: { type: [string, "null"], maxLength: 2000 }
        refusalReason:
          type: [string, "null"]
          maxLength: 2000
          description: Обязательная непустая причина для REFUSED; для остальных статусов только null или отсутствие поля.
    ServiceStatusEntry:
      type: object
      additionalProperties: false
      required: [eventId, sequence, fromStatus, status, timestamp, source]
      properties:
        eventId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        fromStatus:
          oneOf:
            - { $ref: "#/components/schemas/ServiceStatus" }
            - { type: "null" }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        timestamp: { type: string, format: date-time }
        source: { type: string, enum: [SYSTEM, MOCK, TEACHER, SERVICE] }
        comment: { type: [string, "null"], maxLength: 2000 }
        refusalReason: { type: [string, "null"], maxLength: 2000 }
    ServiceAssignment:
      type: object
      additionalProperties: false
      required: [id, sessionId, serviceId, displayName, cardRevision, status, createdAt, updatedAt, deadlineAt, history, overdue]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        serviceId: { type: string, description: Стабильный ID из каталога классификатора }
        displayName: { type: string }
        cardRevision: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        history:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ServiceStatusEntry" }
        overdue:
          type: boolean
          description: На момент чтения срок истёк, а назначение ещё не в COMPLETED, REFUSED или FAILED. Не новый статус.
      example:
        id: "ad6138be-2d41-42d3-80d0-f7c4df6a0ba2"
        sessionId: "0199d7b6-0000-7000-8000-000000000002"
        serviceId: MCHS
        displayName: "Служба 101 (МЧС)"
        cardRevision: 1
        status: ADDED
        createdAt: "2026-09-19T00:00:00Z"
        updatedAt: "2026-09-19T00:00:00Z"
        deadlineAt: "2026-09-19T01:00:00Z"
        overdue: false
        history:
          - eventId: "0199d7b6-0000-7000-8000-000000000004"
            sequence: 1
            fromStatus: null
            status: ADDED
            timestamp: "2026-09-19T00:00:00Z"
            source: SYSTEM
            comment: null
            refusalReason: null
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        scenarioId: { type: string, format: uuid }
        mode: { type: string, enum: [CARD, VOICE], default: CARD }
    StudentAssignment:
      type: object
      additionalProperties: false
      required: [scenario, session]
      properties:
        scenario: { $ref: "#/components/schemas/Scenario" }
        session: { $ref: "#/components/schemas/Session" }
    Session:
      type: object
      additionalProperties: false
      required: [id, scenarioId, mode, state, card, cardRevision, startedAt, timeLimitSeconds]
      properties:
        id: { type: string, format: uuid }
        scenarioId: { type: string, format: uuid }
        mode: { type: string, enum: [CARD, VOICE] }
        state:
          type: string
          enum: [CREATED, READY, RINGING, ACTIVE, COMPLETED, SCORING, SCORED, FAILED]
        card: { $ref: "#/components/schemas/OperatorCard" }
        cardRevision: { type: integer, minimum: 0 }
        startedAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        timeLimitSeconds: { type: integer, minimum: 1 }
        timeLimitExceeded: { type: boolean }
        report:
          type: [object, "null"]
          allOf: [{ $ref: "#/components/schemas/SessionReport" }]
    SaveCardRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: { $ref: "#/components/schemas/OperatorCardInput" }
        expectedRevision:
          type: [integer, "null"]
          minimum: 0
          description: Опциональная защита от перезаписи более нового черновика.
    SubmitCardRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: { $ref: "#/components/schemas/OperatorCardInput" }
        expectedRevision: { type: [integer, "null"], minimum: 0 }
    OperatorCard:
      type: object
      additionalProperties: false
      required: [input, calculation]
      properties:
        input: { $ref: "#/components/schemas/OperatorCardInput" }
        calculation:
          type: [object, "null"]
          allOf: [{ $ref: "#/components/schemas/CardCalculation" }]
    OperatorCardInput:
      type: object
      additionalProperties: false
      description: Поля, которые вводит оператор. Производные поля здесь запрещены.
      properties:
        caller: { $ref: "#/components/schemas/CallerInput" }
        incident: { $ref: "#/components/schemas/IncidentInput" }
        address: { $ref: "#/components/schemas/AddressInput" }
        description:
          type: [string, "null"]
          maxLength: 1999
          description: Описание со слов заявителя.
        victims: { $ref: "#/components/schemas/VictimsInput" }
        facts:
          type: object
          additionalProperties: true
          description: Сценарные дополнительные факты, разрешённые конкретной формой.
    CallerInput:
      type: [object, "null"]
      additionalProperties: false
      properties:
        phoneNumbers:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/PhoneNumber" }
        fullName: { type: [string, "null"], maxLength: 255 }
        status:
          type: [string, "null"]
          enum: [EYEWITNESS, VICTIM, RELATIVE, ACQUAINTANCE, CHILD, PARTICIPANT, OTHER, null]
        communicationChannel:
          type: [string, "null"]
          enum: [VOICE, SMS, OTHER, null]
        language: { type: [string, "null"], maxLength: 64 }
    PhoneNumber:
      type: object
      additionalProperties: false
      required: [value, kind]
      properties:
        value: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [AON, PROVIDED, ON_SCENE] }
        foreign: { type: boolean, default: false }
    IncidentInput:
      type: [object, "null"]
      additionalProperties: false
      properties:
        selectedSignIds:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
          description: Стабильные идентификаторы выбранных признаков из CardFormDefinition.
        answers:
          type: array
          items: { $ref: "#/components/schemas/QuestionAnswer" }
    QuestionAnswer:
      type: object
      additionalProperties: false
      required: [questionId]
      properties:
        questionId: { type: string, minLength: 1 }
        optionIds:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        freeText: { type: [string, "null"], maxLength: 1000 }
      anyOf:
        - required: [optionIds]
        - required: [freeText]
    AddressInput:
      type: [object, "null"]
      additionalProperties: false
      required: [displayAddress]
      properties:
        displayAddress: { type: string, minLength: 1, maxLength: 500 }
        region: { type: [string, "null"], maxLength: 128 }
        locality: { type: [string, "null"], maxLength: 128 }
        street: { type: [string, "null"], maxLength: 128 }
        house: { type: [string, "null"], maxLength: 32 }
        building: { type: [string, "null"], maxLength: 32 }
        apartment: { type: [string, "null"], maxLength: 32 }
        description: { type: [string, "null"], maxLength: 500 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
    VictimsInput:
      type: [object, "null"]
      additionalProperties: false
      required: [present]
      properties:
        present: { type: boolean }
        count: { type: [integer, "null"], minimum: 0 }
        threatToPeople: { type: [boolean, "null"] }
    CardCalculation:
      type: object
      additionalProperties: false
      required: [status, classifierVersion, missingInputIds, services]
      properties:
        status: { type: string, enum: [INCOMPLETE, RESOLVED, NO_MATCH] }
        classifierVersion: { type: string, minLength: 1 }
        classifierCode: { type: [string, "null"], pattern: "^[0-9]{6,9}$" }
        incidentType: { type: [string, "null"] }
        ekp35IncidentType: { type: [string, "null"] }
        responseScenarioCode: { type: [string, "null"] }
        responseScenarioStatus: { type: string, enum: [CODE, MISSING, EXPLICIT_NONE, SOURCE_LABEL] }
        mainServices:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/ServiceRef" }
        services:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/RoutedService" }
        missingInputIds:
          type: array
          uniqueItems: true
          items: { type: string }
        explanations:
          type: array
          items: { type: string }
    ServiceRef:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
    RoutedService:
      type: object
      additionalProperties: false
      required: [id, displayName, reasons]
      properties:
        id: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        reasons:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RoutingReason" }
    RoutingReason:
      type: object
      additionalProperties: false
      required: [ruleId, message]
      properties:
        ruleId: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        matchedInputIds:
          type: array
          uniqueItems: true
          items: { type: string }
    CardFormDefinition:
      type: object
      additionalProperties: false
      required: [classifierVersion, signGroups, questions]
      properties:
        classifierVersion: { type: string, minLength: 1 }
        signGroups:
          type: array
          items: { $ref: "#/components/schemas/SignGroup" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionDefinition" }
    SignGroup:
      type: object
      additionalProperties: false
      required: [id, label, level, options]
      properties:
        id: { type: string }
        label: { type: string }
        level: { type: integer, enum: [1, 2, 3] }
        required: { type: boolean, default: false }
        options:
          type: array
          items: { $ref: "#/components/schemas/SelectionOption" }
    QuestionDefinition:
      type: object
      additionalProperties: false
      required: [id, label, inputType]
      properties:
        id: { type: string }
        label: { type: string }
        inputType: { type: string, enum: [SINGLE_SELECT, MULTI_SELECT, TEXT] }
        required: { type: boolean, default: false }
        options:
          type: array
          items: { $ref: "#/components/schemas/SelectionOption" }
    SelectionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    Scenario:
      type: object
      additionalProperties: false
      required: [id, version, title, category, difficulty, profile, groundTruth, rubric]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1 }
        category: { type: string }
        difficulty: { type: string, enum: [BASIC, INTERMEDIATE, ADVANCED] }
        profile: { type: string, minLength: 1 }
        timeLimitSeconds: { type: integer, minimum: 1, default: 30 }
        groundTruth: { $ref: "#/components/schemas/GroundTruth" }
        rubric: { $ref: "#/components/schemas/Rubric" }
    GroundTruth:
      description: |
        Основная форма — GroundTruthV2. LegacyGroundTruth поддерживается только
        во время миграции Python AI в задаче #35.
      oneOf:
        - $ref: "#/components/schemas/GroundTruthV2"
        - $ref: "#/components/schemas/LegacyGroundTruth"
    GroundTruthV2:
      type: object
      additionalProperties: false
      required: [classifierVersion, classifierCode, incidentType, ekp35IncidentType, responseScenarioCode, responseScenarioStatus, mainServices, requiredServices, expectedInput]
      properties:
        classifierVersion: { type: string, minLength: 1 }
        classifierCode: { type: string, pattern: "^[0-9]{6,9}$" }
        incidentType: { type: string, minLength: 1 }
        ekp35IncidentType: { type: [string, "null"], minLength: 1 }
        responseScenarioCode: { type: [string, "null"], minLength: 1 }
        responseScenarioStatus: { type: string, enum: [CODE, MISSING, EXPLICIT_NONE, SOURCE_LABEL] }
        mainServices:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/ServiceRef" }
        requiredServices:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/RoutedService" }
        expectedInput: { $ref: "#/components/schemas/OperatorCardInput" }
    LegacyGroundTruth:
      type: object
      description: Deprecated temporary compatibility shape for 0.1 scenario fixtures.
      additionalProperties: true
      required: [incidentType, requiredServices]
      not:
        required: [classifierVersion]
      properties:
        incidentType: { type: string, minLength: 1 }
        ekpCode: { type: string, pattern: "^[0-9]{6,9}$" }
        signs:
          type: object
          required: [level1]
          properties:
            level1: { type: string }
            level2: { type: [string, "null"] }
            level3: { type: [string, "null"] }
            additional:
              type: array
              uniqueItems: true
              items: { type: string }
        address: { type: [string, "null"] }
        requiredServices:
          type: array
          uniqueItems: true
          items: { type: string }
        facts: { type: object, additionalProperties: true }
    Rubric:
      type: object
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, description, weight]
            properties:
              code: { type: string }
              description: { type: string }
              weight: { type: number, minimum: 0 }
              critical: { type: boolean, default: false }
    SessionReport:
      type: object
      additionalProperties: false
      required: [sessionId, score, maxScore, passed, criteria, errors, recommendations]
      properties:
        sessionId: { type: string, format: uuid }
        classifierVersion: { type: [string, "null"] }
        classifierCode: { type: [string, "null"], pattern: "^[0-9]{6,9}$" }
        score: { type: number }
        maxScore: { type: number }
        passed: { type: boolean }
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, passed, points, maxPoints, message]
            properties:
              code: { type: string }
              passed: { type: boolean }
              points: { type: number }
              maxPoints: { type: number }
              message: { type: string }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: [string, "null"] }
        recommendations:
          type: array
          items: { type: string }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: [string, "null"] }
