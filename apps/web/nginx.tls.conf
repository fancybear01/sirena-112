# TLS для браузерного доступа. Задача #89.
#
# Отдельным файлом, а не правкой default.conf: профиль без TLS остаётся
# рабочим. Включается наложением compose.tls.yaml, которое монтирует этот
# файл и каталог с сертификатами.
#
# Сертификаты в образ не встраиваются и в репозиторий не попадают: они
# монтируются снаружи из ./certs. Как их выпустить и менять - docs/tls.md.

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/sirena.crt;
    ssl_certificate_key /etc/nginx/certs/sirena.key;

    # Только современные версии: TLS 1.0 и 1.1 небезопасны и в браузерах
    # уже отключены.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SIRENA:10m;
    ssl_session_timeout 1h;

    # Контур локальный, но заголовки ставим: они ничего не стоят, а
    # защищают от случайного открытия наружу и от подмешивания в рамку.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"sirena-web","tls":true}';
    }

    location /api/ {
        proxy_pass http://core:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Core должен знать, что снаружи был https, иначе он соберёт ссылки
        # по http и браузер их заблокирует как смешанное содержимое.
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://core:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
