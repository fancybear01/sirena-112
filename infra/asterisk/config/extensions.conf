[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]

[from-internal]
exten => _10XX,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},45)
 same => n,Hangup()

; A loopback endpoint used only by the automated offline voice smoke.
; It waits for Media to attach, plays a synthetic operator phrase and remains
; connected long enough for Vosk/Piper to complete one real turn.
[smoke-loop]
exten => smoke,1,Answer()
 same => n,Wait(2)
 same => n,Playback(smoke-address)
 same => n,Wait(15)
 same => n,Hangup()
