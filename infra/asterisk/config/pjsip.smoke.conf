; Two loopback transports keep source and destination sockets distinct.
[transport-smoke-out]
type=transport
protocol=udp
bind=127.0.0.1:5061

[transport-smoke-in]
type=transport
protocol=udp
bind=127.0.0.1:5062

[smoke-out]
type=endpoint
transport=transport-smoke-out
aors=smoke-out
disallow=all
allow=ulaw
direct_media=no
from_user=smoke

[smoke-out]
type=aor
contact=sip:smoke@127.0.0.1:5062
qualify_frequency=0

[smoke-in]
type=endpoint
transport=transport-smoke-in
context=smoke-loop
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[smoke-in-identify]
type=identify
endpoint=smoke-in
match=127.0.0.1
