spring:
  application:
    name: sirena-core
  jackson:
    deserialization:
      # Тела запросов строгие: вычисляемые поля карточки (incidentType, службы)
      # не могут быть подменены клиентом и попадают в 400.
      fail-on-unknown-properties: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: ${CORE_PORT:8080}
  shutdown: graceful

core:
  environment: ${CORE_ENVIRONMENT:local}
  version: ${CORE_VERSION:dev}
  ai-base-url: ${CORE_AI_BASE_URL:http://localhost:8090}
  media-base-url: ${CORE_MEDIA_BASE_URL:http://localhost:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
