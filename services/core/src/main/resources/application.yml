spring:
  application:
    name: sirena-core
  datasource:
    # In-memory storage is the explicit local/test fallback. PostgreSQL is enabled
    # with CORE_STORAGE=postgres and CORE_DATABASE_URL in deployment.
    url: ${CORE_DATABASE_URL:jdbc:h2:mem:sirena-core;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${CORE_DATABASE_USERNAME:sa}
    password: ${CORE_DATABASE_PASSWORD:}
  flyway:
    enabled: ${CORE_FLYWAY_ENABLED:false}
  jackson:
    deserialization:
      # Тела запросов строгие: вычисляемые поля карточки (incidentType, службы)
      # не могут быть подменены клиентом и попадают в 400.
      fail-on-unknown-properties: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: ${CORE_PORT:8080}
  shutdown: graceful

core:
  storage: ${CORE_STORAGE:in-memory}
  recordings-dir: ${CORE_RECORDINGS_DIR:}
  auth:
    enabled: ${CORE_AUTH_ENABLED:false}
    bootstrap-admin-username: ${CORE_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${CORE_BOOTSTRAP_ADMIN_PASSWORD:}
    media-token: ${CORE_MEDIA_SERVICE_TOKEN:}
  scenario-import:
    enabled: ${CORE_SCENARIO_IMPORT_ENABLED:false}
  environment: ${CORE_ENVIRONMENT:local}
  version: ${CORE_VERSION:dev}
  ai-base-url: ${CORE_AI_BASE_URL:http://localhost:8090}
  media-base-url: ${CORE_MEDIA_BASE_URL:http://localhost:8091}
  media-mode: ${CORE_MEDIA_MODE:http}
  service-assignments:
    deadline-seconds: ${CORE_SERVICE_ASSIGNMENT_DEADLINE_SECONDS:3600}
    mock-updates-enabled: ${CORE_SERVICE_ASSIGNMENT_MOCK_UPDATES_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
