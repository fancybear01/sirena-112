spring:
  application:
    name: sirena-core
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: ${CORE_PORT:8080}
  shutdown: graceful

core:
  environment: ${CORE_ENVIRONMENT:local}
  version: ${CORE_VERSION:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
