[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sirena-ai"
version = "0.1.0"
description = "Sirena-112 AI service: сценарии, поведение абонента и оценка занятия"
# Зависимости, добавленные вместе с проверкой контрактов, требуют 3.10:
# на 3.9 окружение уже не собирается.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
    # Морфология русского языка для разбора текста карточки. Лицензия MIT
    # и у кода, и у словаря, поэтому пригодна для поставки заказчику.
    # Словарь локальный, пятнадцать мегабайт, сеть при работе не нужна.
    # Без неё сервис работает, но честно пишет, что грамотность не проверял.
    "pymorphy3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
    "openapi-spec-validator>=0.9",
    # Нужен тестам нагрузки: они поднимают настоящий uvicorn и подключаются
    # к нему как Media. Приходит и вместе с uvicorn[standard], но полагаться
    # на чужую необязательную зависимость не стоит.
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
